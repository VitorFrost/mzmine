name: Execute Public Workflow Headlessly

on:
  push:
    branches:
      - agent/public-workflow-progressive-execution
  pull_request:
    branches:
      - open-offline-main
    paths:
      - src/test/java/io/github/mzmine/modules/batchmode/PublicWorkflowHeadlessFixtureTest.java
      - scripts/run_public_workflow_headless.py
      - .github/workflows/run_public_workflow_headless.yml
      - datasets/public_workflow_manifest.json
      - datasets/public_blank_replicate_manifest.json
      - scripts/fetch_public_test_data.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execute-public-workflow:
    name: Execute public workflow (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java 20
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "20"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Validate frozen public manifests
        shell: bash
        run: |
          python scripts/fetch_public_test_data.py \
            --manifest datasets/public_workflow_manifest.json \
            --validate
          python scripts/fetch_public_test_data.py \
            --manifest datasets/public_blank_replicate_manifest.json \
            --validate

      - name: Download and verify published settings
        shell: bash
        run: |
          python scripts/fetch_public_test_data.py \
            --manifest datasets/public_workflow_manifest.json \
            --dataset zenodo-14000687-mzmine-processing-settings \
            --output-dir build/public_validation_data \
            --timeout 300 \
            --retries 3
          python scripts/fetch_public_test_data.py \
            --manifest datasets/public_workflow_manifest.json \
            --dataset zenodo-14000687-mzmine-processing-settings \
            --output-dir build/public_validation_data \
            --verify-existing

      - name: Download and verify approved mzML fixtures
        shell: bash
        run: |
          python scripts/fetch_public_test_data.py \
            --manifest datasets/public_blank_replicate_manifest.json \
            --dataset zenodo-14001110-banane-30ngml-002 \
            --dataset zenodo-14001110-blank-001 \
            --output-dir build/public_validation_data \
            --timeout 300 \
            --retries 3
          python scripts/fetch_public_test_data.py \
            --manifest datasets/public_blank_replicate_manifest.json \
            --dataset zenodo-14001110-banane-30ngml-002 \
            --dataset zenodo-14001110-blank-001 \
            --output-dir build/public_validation_data \
            --verify-existing

      - name: Generate real public-workflow batch on Linux
        if: runner.os != 'Windows'
        env:
          OPEN_OFFLINE_PUBLIC_MZMINE_SETTINGS: ${{ github.workspace }}/build/public_validation_data/zenodo/14000687/MZmine processing settings.xml
          OPEN_OFFLINE_PUBLIC_MZML_REPLICATE_2: ${{ github.workspace }}/build/public_validation_data/zenodo/14001110/Banane_30ngmL_002.mzML
          OPEN_OFFLINE_PUBLIC_MZML_BLANK_1: ${{ github.workspace }}/build/public_validation_data/zenodo/14001110/blank_001.mzML
        run: >-
          ./gradlew test
          --tests io.github.mzmine.modules.batchmode.PublicWorkflowHeadlessFixtureTest
          --no-daemon
          --stacktrace

      - name: Generate real public-workflow batch on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          OPEN_OFFLINE_PUBLIC_MZMINE_SETTINGS: ${{ github.workspace }}\build\public_validation_data\zenodo\14000687\MZmine processing settings.xml
          OPEN_OFFLINE_PUBLIC_MZML_REPLICATE_2: ${{ github.workspace }}\build\public_validation_data\zenodo\14001110\Banane_30ngmL_002.mzML
          OPEN_OFFLINE_PUBLIC_MZML_BLANK_1: ${{ github.workspace }}\build\public_validation_data\zenodo\14001110\blank_001.mzML
        run: >-
          .\gradlew.bat test
          --tests io.github.mzmine.modules.batchmode.PublicWorkflowHeadlessFixtureTest
          --no-daemon
          --stacktrace

      - name: Execute and diagnose public workflow
        run: python scripts/run_public_workflow_headless.py --timeout-seconds 3600 --threads 2

      - name: Display execution report on Linux
        if: always() && runner.os != 'Windows' && hashFiles('build/public_workflow_execution/public_workflow_execution.json') != ''
        run: cat build/public_workflow_execution/public_workflow_execution.json

      - name: Display execution report on Windows
        if: always() && runner.os == 'Windows' && hashFiles('build/public_workflow_execution/public_workflow_execution.json') != ''
        shell: pwsh
        run: Get-Content build/public_workflow_execution/public_workflow_execution.json

      - name: Remove downloaded public dataset bytes on Linux
        if: always() && runner.os != 'Windows'
        run: rm -rf build/public_validation_data

      - name: Remove downloaded public dataset bytes on Windows
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path build/public_validation_data) {
            Remove-Item -Recurse -Force build/public_validation_data
          }

      - name: Upload diagnostic artifacts only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-workflow-execution-${{ matrix.os }}
          path: |
            build/public_workflow_execution/public_workflow.mzbatch
            build/public_workflow_execution/public_workflow_fixture.json
            build/public_workflow_execution/public_workflow_execution.json
            build/public_workflow_execution/public_workflow.log
            build/reports/tests/test/
            build/test-results/test/
          if-no-files-found: warn
          retention-days: 14

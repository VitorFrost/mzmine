name: MZmine v4.0.8 minimum-search resolver differential

on:
  workflow_dispatch:
  push:
    branches:
      - "open-offline-main"
      - "agent/v408-minimum-search-resolver-differential"
    paths:
      - ".github/workflows/v408_minimum_search_resolver_differential.yml"
      - "datasets/parity/v408_minimum_search_resolver_source_inventory.json"
      - "scripts/audit_v408_minimum_search_resolver_source.py"
      - "scripts/prepare_v408_feature_resolver_task_probe.py"
      - "scripts/tests/test_prepare_v408_feature_resolver_task_probe.py"
      - "src/test/java/MZmineMinimumSearchResolverSideAcceptanceTest.java"
      - "src/main/java/io/github/mzmine/modules/dataprocessing/featdet_chromatogramdeconvolution/**"
  pull_request:
    branches:
      - "open-offline-main"
    paths:
      - ".github/workflows/v408_minimum_search_resolver_differential.yml"
      - "datasets/parity/v408_minimum_search_resolver_source_inventory.json"
      - "scripts/audit_v408_minimum_search_resolver_source.py"
      - "scripts/prepare_v408_feature_resolver_task_probe.py"
      - "scripts/tests/test_prepare_v408_feature_resolver_task_probe.py"
      - "src/test/java/MZmineMinimumSearchResolverSideAcceptanceTest.java"

permissions:
  contents: read

concurrency:
  group: v408-minimum-search-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  direct-differential:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      ORACLE_COMMIT: 8029f930d28c0447f0acf2bcabef0a79865ad434
      ORACLE_PATH: build/oracle/mzmine-v4.0.8
      SOURCE_REPORT: build/minimum_search_parity/v408-minimum-search-source-audit.json
      PROBE_SOURCE: src/test/java/io/github/mzmine/modules/dataprocessing/featdet_chromatogramdeconvolution/V408FeatureResolverTaskProbe.java
      PROBE_EVIDENCE: build/minimum_search_parity/v408-feature-resolver-task-probe.json
      DATA_ROOT: build/public_validation_data
      DATASET_ID: zenodo-14001110-banane-30ngml-001
      INPUT_FILE: build/public_validation_data/zenodo/14001110/Banane_30ngmL_001.mzML
      INPUT_SHA256: 2eb189e193925983ddf8348a13a4c96fa7382e4e790665a204251eb036aea77d
      SETTINGS_DATASET_ID: zenodo-14000687-mzmine-processing-settings
      SETTINGS_FILE: build/public_validation_data/zenodo/14000687/MZmine processing settings.xml
      SETTINGS_SHA256: 87845675b0cda32e7ce4c70a2a03f1a8ad465d18d018ede1db57fe61adee074c
      CANDIDATE_REPORT: build/minimum_search_parity/open-offline-minimum-search-side.json
      ORACLE_REPORT: build/minimum_search_parity/v408-minimum-search-side.json
      DIFFERENTIAL_REPORT: build/minimum_search_parity/v408-open-offline-minimum-search-differential.json
      JAVA_TOOL_OPTIONS: -Xmx5g -Djava.util.concurrent.ForkJoinPool.common.parallelism=1
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test FeatureResolverTask probe preparation
        run: python -m unittest scripts/tests/test_prepare_v408_feature_resolver_task_probe.py -v

      - name: Set up Java 20
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "20"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Check out exact v4.0.8 oracle
        uses: actions/checkout@v4
        with:
          repository: mzmine/mzmine
          ref: 8029f930d28c0447f0acf2bcabef0a79865ad434
          path: build/oracle/mzmine-v4.0.8
          fetch-depth: 1
          persist-credentials: false

      - name: Audit resolver and generic feature-resolver source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/minimum_search_parity
          python scripts/audit_v408_minimum_search_resolver_source.py \
            --fork-root . \
            --oracle-root "${ORACLE_PATH}" \
            --inventory datasets/parity/v408_minimum_search_resolver_source_inventory.json \
            --output "${SOURCE_REPORT}"

      - name: Prepare exact v4.0.8 FeatureResolverTask probe
        shell: bash
        run: |
          set -euo pipefail
          rm -f "${PROBE_SOURCE}" "${PROBE_EVIDENCE}"
          python scripts/prepare_v408_feature_resolver_task_probe.py \
            --oracle-checkout "${ORACLE_PATH}" \
            --candidate-root . \
            --output "${PROBE_SOURCE}" \
            --evidence "${PROBE_EVIDENCE}"
          test -s "${PROBE_SOURCE}"
          test -s "${PROBE_EVIDENCE}"

      - name: Compile candidate and exact resolver task probe
        shell: bash
        run: |
          set -o pipefail
          ./gradlew compileTestJava --no-daemon --stacktrace \
            2>&1 | tee build/minimum_search_parity/v408-feature-resolver-probe-compile.log

      - name: Download governed public mzML
        run: >-
          python scripts/fetch_public_test_data.py
          --manifest datasets/public_validation_manifest.json
          --dataset "${DATASET_ID}"
          --output-dir "${DATA_ROOT}"
          --timeout 180
          --retries 3

      - name: Download published MZmine settings
        run: >-
          python scripts/fetch_public_test_data.py
          --manifest datasets/public_workflow_manifest.json
          --dataset "${SETTINGS_DATASET_ID}"
          --output-dir "${DATA_ROOT}"
          --timeout 120
          --retries 3

      - name: Verify governed bytes again
        shell: bash
        run: |
          set -euo pipefail
          python scripts/fetch_public_test_data.py --manifest datasets/public_validation_manifest.json \
            --dataset "${DATASET_ID}" --output-dir "${DATA_ROOT}" --verify-existing
          python scripts/fetch_public_test_data.py --manifest datasets/public_workflow_manifest.json \
            --dataset "${SETTINGS_DATASET_ID}" --output-dir "${DATA_ROOT}" --verify-existing

      - name: Execute open-offline resolver side in isolated JVM
        id: candidate
        continue-on-error: true
        shell: bash
        env:
          MZMINE_RESOLVER_PARITY_INPUT: ${{ github.workspace }}/${{ env.INPUT_FILE }}
          MZMINE_RESOLVER_PARITY_SETTINGS: ${{ github.workspace }}/${{ env.SETTINGS_FILE }}
          MZMINE_RESOLVER_PARITY_SIDE: candidate
          MZMINE_RESOLVER_PARITY_SIDE_OUTPUT: ${{ github.workspace }}/${{ env.CANDIDATE_REPORT }}
          MZMINE_RESOLVER_PARITY_INPUT_SHA256: ${{ env.INPUT_SHA256 }}
          MZMINE_RESOLVER_PARITY_SETTINGS_SHA256: ${{ env.SETTINGS_SHA256 }}
          MZMINE_RESOLVER_PARITY_CANDIDATE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -o pipefail
          rm -rf build/test-results/test build/reports/tests/test
          ./gradlew test --tests MZmineMinimumSearchResolverSideAcceptanceTest --no-daemon --stacktrace \
            2>&1 | tee build/minimum_search_parity/open-offline-minimum-search-side.log
          code=${PIPESTATUS[0]}
          if [[ -f build/test-results/test/TEST-MZmineMinimumSearchResolverSideAcceptanceTest.xml ]]; then
            cp build/test-results/test/TEST-MZmineMinimumSearchResolverSideAcceptanceTest.xml \
              build/minimum_search_parity/open-offline-minimum-search-side-junit.xml
          fi
          exit "${code}"

      - name: Execute frozen v4.0.8 resolver side in isolated JVM
        id: oracle
        continue-on-error: true
        shell: bash
        env:
          MZMINE_RESOLVER_PARITY_INPUT: ${{ github.workspace }}/${{ env.INPUT_FILE }}
          MZMINE_RESOLVER_PARITY_SETTINGS: ${{ github.workspace }}/${{ env.SETTINGS_FILE }}
          MZMINE_RESOLVER_PARITY_SIDE: oracle
          MZMINE_RESOLVER_PARITY_SIDE_OUTPUT: ${{ github.workspace }}/${{ env.ORACLE_REPORT }}
          MZMINE_RESOLVER_PARITY_INPUT_SHA256: ${{ env.INPUT_SHA256 }}
          MZMINE_RESOLVER_PARITY_SETTINGS_SHA256: ${{ env.SETTINGS_SHA256 }}
          MZMINE_RESOLVER_PARITY_CANDIDATE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -o pipefail
          rm -rf build/test-results/test build/reports/tests/test
          ./gradlew test --tests MZmineMinimumSearchResolverSideAcceptanceTest --no-daemon --stacktrace \
            2>&1 | tee build/minimum_search_parity/v408-minimum-search-side.log
          code=${PIPESTATUS[0]}
          if [[ -f build/test-results/test/TEST-MZmineMinimumSearchResolverSideAcceptanceTest.xml ]]; then
            cp build/test-results/test/TEST-MZmineMinimumSearchResolverSideAcceptanceTest.xml \
              build/minimum_search_parity/v408-minimum-search-side-junit.xml
          fi
          exit "${code}"

      - name: Compare normalized resolver reports
        if: always()
        shell: bash
        env:
          CANDIDATE_OUTCOME: ${{ steps.candidate.outcome }}
          ORACLE_OUTCOME: ${{ steps.oracle.outcome }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          candidate_path = Path(os.environ["CANDIDATE_REPORT"])
          oracle_path = Path(os.environ["ORACLE_REPORT"])
          output = Path(os.environ["DIFFERENTIAL_REPORT"])

          def junit_problem(path):
            path = Path(path)
            if not path.is_file(): return None
            root = ET.parse(path).getroot()
            for case in root.findall('.//testcase'):
              problem = case.find('failure') or case.find('error')
              if problem is not None:
                return problem.get('message') or (problem.text or '').strip()
            return None

          if not candidate_path.is_file() or not oracle_path.is_file():
            details = {
              "candidate_report_exists": candidate_path.is_file(),
              "oracle_report_exists": oracle_path.is_file(),
              "candidate_outcome": os.environ.get("CANDIDATE_OUTCOME"),
              "oracle_outcome": os.environ.get("ORACLE_OUTCOME"),
              "candidate_junit_problem": junit_problem("build/minimum_search_parity/open-offline-minimum-search-side-junit.xml"),
              "oracle_junit_problem": junit_problem("build/minimum_search_parity/v408-minimum-search-side-junit.xml"),
            }
            print(json.dumps(details, indent=2, sort_keys=True))
            raise SystemExit("Resolver side execution failed before direct comparison")

          candidate = json.loads(candidate_path.read_text(encoding="utf-8"))
          oracle = json.loads(oracle_path.read_text(encoding="utf-8"))
          for field in (
              "input_sha256", "published_settings_sha256", "pre_resolver_feature_count",
              "pre_resolver_records_sha256", "resolver_class", "resolver_parameters_class",
              "resolver_parameters_sha256"):
            if candidate.get(field) != oracle.get(field):
              raise SystemExit(f"Resolver parity precondition differs: {field}")

          candidate_records = candidate["records"]
          oracle_records = oracle["records"]
          equal = candidate_records == oracle_records
          first = None
          for i in range(min(len(candidate_records), len(oracle_records))):
            if candidate_records[i] != oracle_records[i]:
              first = {"index": i, "candidate": candidate_records[i], "oracle": oracle_records[i]}
              break
          if first is None and len(candidate_records) != len(oracle_records):
            first = {"index": min(len(candidate_records), len(oracle_records)), "candidate": None, "oracle": None}

          report = {
            "schema_version": 1,
            "gate_id": "mzmine-v4.0.8-minimum-search-resolver-direct-differential-v1",
            "candidate_commit": candidate["candidate_commit"],
            "oracle_commit": oracle["oracle_commit"],
            "input_sha256": candidate["input_sha256"],
            "published_settings_sha256": candidate["published_settings_sha256"],
            "pre_resolver_feature_count": candidate["pre_resolver_feature_count"],
            "pre_resolver_records_sha256": candidate["pre_resolver_records_sha256"],
            "resolver_class": candidate["resolver_class"],
            "resolver_parameters_class": candidate["resolver_parameters_class"],
            "resolver_parameters_sha256": candidate["resolver_parameters_sha256"],
            "candidate_output_feature_count": candidate["output_feature_count"],
            "oracle_output_feature_count": oracle["output_feature_count"],
            "candidate_records_sha256": candidate["output_records_sha256"],
            "oracle_records_sha256": oracle["output_records_sha256"],
            "records_equal": equal,
            "first_mismatch": first,
          }
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          report["report_sha256"] = hashlib.sha256(output.read_bytes()).hexdigest()
          print(json.dumps(report, indent=2, sort_keys=True))
          if not equal:
            sys.exit(1)
          PY

      - name: Remove generated resolver probe
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "${PROBE_SOURCE}" ]]; then
            status="$(git status --short -- "${PROBE_SOURCE}" | cut -c1-2)"
            if [[ "${status}" != "??" ]]; then
              echo "generated resolver probe touched tracked source: ${status}"
              exit 1
            fi
            rm -f "${PROBE_SOURCE}"
          fi

      - name: Remove downloaded public data
        if: always()
        shell: bash
        run: |
          rm -rf "${DATA_ROOT}"
          test ! -e "${DATA_ROOT}"

      - name: Upload resolver differential evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v408-minimum-search-direct-differential-${{ github.run_id }}
          path: |
            build/minimum_search_parity/
            build/reports/tests/test/
            build/test-results/test/
          if-no-files-found: warn
          retention-days: 30

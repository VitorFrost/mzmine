name: Open Offline release guard

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-not-implemented:
    name: Confirm release automation status
    runs-on: ubuntu-latest
    steps:
      - name: Record non-publishing release status
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "Open Offline packaged release automation is not implemented."
            echo "This manual workflow is intentionally read-only."
            echo "It does not commit, tag, upload artifacts, create a release, or use publishing secrets."
            echo "Portable Windows/Linux packaging, checksums, licenses, and SBOM remain a future release gate."
            echo "repository=${GITHUB_REPOSITORY}"
            echo "ref=${GITHUB_REF}"
            echo "sha=${GITHUB_SHA}"
          } | tee release-guard-status.txt

      - name: Upload release-status evidence
        uses: actions/upload-artifact@v4
        with:
          name: open-offline-release-guard-${{ github.run_id }}
          path: release-guard-status.txt
          if-no-files-found: error
          retention-days: 30

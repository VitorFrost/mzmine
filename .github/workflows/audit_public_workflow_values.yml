name: Audit Public Workflow Values

on:
  push:
    branches:
      - agent/public-workflow-value-audit
  pull_request:
    branches:
      - open-offline-main
    paths:
      - src/test/java/io/github/mzmine/modules/batchmode/PublicWorkflowParameterValueAuditTest.java
      - .github/workflows/audit_public_workflow_values.yml
      - datasets/public_workflow_manifest.json
      - datasets/expected/zenodo_14000687_mzmine_settings_inventory.json
      - scripts/fetch_public_test_data.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-values:
    name: Audit canonical values (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java 20
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "20"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Validate and download frozen settings XML
        shell: bash
        run: |
          python scripts/fetch_public_test_data.py \
            --manifest datasets/public_workflow_manifest.json \
            --validate
          python scripts/fetch_public_test_data.py \
            --manifest datasets/public_workflow_manifest.json \
            --dataset zenodo-14000687-mzmine-processing-settings \
            --output-dir build/public_validation_data \
            --timeout 120 \
            --retries 3
          python scripts/fetch_public_test_data.py \
            --manifest datasets/public_workflow_manifest.json \
            --dataset zenodo-14000687-mzmine-processing-settings \
            --output-dir build/public_validation_data \
            --verify-existing

      - name: Audit canonical values on Linux
        if: runner.os != 'Windows'
        env:
          OPEN_OFFLINE_PUBLIC_MZMINE_SETTINGS: ${{ github.workspace }}/build/public_validation_data/zenodo/14000687/MZmine processing settings.xml
        run: >-
          ./gradlew test
          --tests io.github.mzmine.modules.batchmode.PublicWorkflowParameterValueAuditTest
          --no-daemon
          --stacktrace

      - name: Audit canonical values on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          OPEN_OFFLINE_PUBLIC_MZMINE_SETTINGS: ${{ github.workspace }}\build\public_validation_data\zenodo\14000687\MZmine processing settings.xml
        run: >-
          .\gradlew.bat test
          --tests io.github.mzmine.modules.batchmode.PublicWorkflowParameterValueAuditTest
          --no-daemon
          --stacktrace

      - name: Display value audit on Linux
        if: always() && runner.os != 'Windows' && hashFiles('build/public_workflow_validation/mzmine_settings_value_audit.json') != ''
        run: cat build/public_workflow_validation/mzmine_settings_value_audit.json

      - name: Display value audit on Windows
        if: always() && runner.os == 'Windows' && hashFiles('build/public_workflow_validation/mzmine_settings_value_audit.json') != ''
        shell: pwsh
        run: Get-Content build/public_workflow_validation/mzmine_settings_value_audit.json

      - name: Remove downloaded XML on Linux
        if: always() && runner.os != 'Windows'
        run: rm -rf build/public_validation_data

      - name: Remove downloaded XML on Windows
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path build/public_validation_data) {
            Remove-Item -Recurse -Force build/public_validation_data
          }

      - name: Upload value audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-workflow-value-audit-${{ matrix.os }}
          path: |
            build/public_workflow_validation/mzmine_settings_value_audit.json
            build/reports/tests/test/
            build/test-results/test/
          if-no-files-found: warn
          retention-days: 14

name: Public parity stage report

on:
  workflow_dispatch:
    inputs:
      source_ms_level:
        description: "MS level to use as the source-data stream. This is a manual label, not an automatic inference."
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
  push:
    branches:
      - "open-offline-main"
      - "agent/public-parity-report-*"
      - "agent/manual-source-ms-level"
    paths:
      - ".github/workflows/public_parity_stage_report.yml"
      - "datasets/public_validation_manifest.json"
      - "datasets/parity/differential_stage_report.schema.json"
      - "scripts/fetch_public_test_data.py"
      - "scripts/generate_mzmine_stage_report.py"
      - "scripts/compare_mzmine_stage_reports.py"
      - "src/main/java/io/github/mzmine/util/parity/**"
      - "src/test/java/MZmineDifferentialReportAcceptanceTest.java"
      - "src/test/java/MZmineDifferentialSourceLevelTest.java"
      - "src/test/java/io/github/mzmine/util/parity/**"
  pull_request:
    branches:
      - "open-offline-main"
    paths:
      - ".github/workflows/public_parity_stage_report.yml"
      - "datasets/public_validation_manifest.json"
      - "datasets/parity/differential_stage_report.schema.json"
      - "scripts/fetch_public_test_data.py"
      - "scripts/generate_mzmine_stage_report.py"
      - "scripts/compare_mzmine_stage_reports.py"
      - "src/main/java/io/github/mzmine/util/parity/**"
      - "src/test/java/MZmineDifferentialReportAcceptanceTest.java"
      - "src/test/java/MZmineDifferentialSourceLevelTest.java"
      - "src/test/java/io/github/mzmine/util/parity/**"

permissions:
  contents: read

concurrency:
  group: public-parity-stage-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  open-offline-report:
    name: Generate open-offline import and mass-detection report
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATASET_ID: zenodo-14001110-banane-30ngml-001
      DATA_ROOT: build/public_validation_data
      INPUT_FILE: build/public_validation_data/zenodo/14001110/Banane_30ngmL_001.mzML
      REPORT_FILE: parity-artifacts/open-offline-import-mass-detection.json
      SOURCE_MS_LEVEL: ${{ inputs.source_ms_level || '1' }}
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SOURCE_REF: ${{ github.head_ref || github.ref_name }}

    steps:
      - name: Check out exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java 20
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "20"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Record exact execution provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p parity-artifacts
          actual_sha="$(git rev-parse HEAD)"
          test "${actual_sha}" = "${SOURCE_SHA}"
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "source_ref=${SOURCE_REF}"
            echo "source_sha=${SOURCE_SHA}"
            echo "actual_sha=${actual_sha}"
            echo "source_ms_level=${SOURCE_MS_LEVEL}"
            echo "source_level_selection=manual"
            echo "runner_os=${RUNNER_OS}"
            echo "java_home=${JAVA_HOME}"
            python --version
            java -version 2>&1
          } > parity-artifacts/execution-metadata.txt

      - name: Download and verify governed public mzML
        run: >-
          python scripts/fetch_public_test_data.py
          --dataset "${DATASET_ID}"
          --output-dir "${DATA_ROOT}"
          --timeout 180
          --retries 3

      - name: Verify downloaded bytes again
        run: >-
          python scripts/fetch_public_test_data.py
          --dataset "${DATASET_ID}"
          --output-dir "${DATA_ROOT}"
          --verify-existing

      - name: Generate normalized open-offline report
        run: >-
          python scripts/generate_mzmine_stage_report.py
          --input "${INPUT_FILE}"
          --output "${REPORT_FILE}"
          --dataset-id "${DATASET_ID}"
          --producer-repository "${GITHUB_REPOSITORY}"
          --producer-ref "${SOURCE_REF}"
          --producer-commit "${SOURCE_SHA}"
          --application-version "3.9.1"
          --threads 1
          --source-ms-level "${SOURCE_MS_LEVEL}"

      - name: Summarize report
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          report_path = Path("parity-artifacts/open-offline-import-mass-detection.json")
          report = json.loads(report_path.read_text(encoding="utf-8"))
          stages = report["stages"]
          summary = {
              "report_sha256": hashlib.sha256(report_path.read_bytes()).hexdigest(),
              "producer_commit": report["producer"]["commit"],
              "input_sha256": report["input"]["sha256"],
              "settings_mapping_id": report["settings"]["mapping_id"],
              "settings_sha256": report["settings"]["sha256"],
              "import_record_count": len(stages["import"]["records"]),
              "import_total_point_count": stages["import"]["summary"]["total_point_count"],
              "mass_detection_record_count": len(stages["mass_detection"]["records"]),
              "mass_detection_total_point_count": stages["mass_detection"]["summary"]["total_point_count"],
          }
          Path("parity-artifacts/open-offline-report-summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Upload normalized evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: open-offline-parity-stage-${{ github.run_id }}
          path: |
            parity-artifacts/
            build/reports/tests/test/
            build/test-results/test/
          if-no-files-found: error
          retention-days: 30

      - name: Delete public raw bytes
        if: always()
        shell: bash
        run: |
          rm -rf "${DATA_ROOT}"
          test ! -e "${DATA_ROOT}"

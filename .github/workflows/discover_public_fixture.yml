name: Discover Public MassIVE Fixture

on:
  push:
    branches:
      - agent/public-small-lcms-fixture
  pull_request:
    branches:
      - open-offline-main
    paths:
      - scripts/discover_massive_fixture.py
      - .github/workflows/discover_public_fixture.yml
      - datasets/public_validation_manifest.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover-small-lcms-fixture:
    name: Resolve and hash MSV000101091 fixture
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve official dataset and file URL
        run: >-
          python scripts/discover_massive_fixture.py
          --task f6100fda35654d40a061715874c699b0
          --accession MSV000101091
          --listed-path "f.MSV000101091/ccms_peak/Metabolomics raw data/Method1_Set277193_100_BOST-06537.mzML"
          --expected-size 16978328
          --output-directory build/public_fixture_discovery
          --timeout 60
          --resolve-only

      - name: Display resolved metadata
        run: cat build/public_fixture_discovery/fixture_resolution.json

      - name: Diagnose and verify FTPS certificate chain
        shell: bash
        run: |
          set -euo pipefail
          TLS_DIR="build/public_fixture_discovery/tls"
          mkdir -p "$TLS_DIR/certs"

          # Capture exactly what the public FTPS endpoint presents. Failure of the
          # normal system-chain verification is expected when an intermediate is omitted.
          timeout 30s openssl s_client \
            -starttls ftp \
            -connect massive-ftp.ucsd.edu:21 \
            -servername massive-ftp.ucsd.edu \
            -showcerts \
            </dev/null >"$TLS_DIR/handshake.txt" 2>&1 || true

          awk -v out="$TLS_DIR/certs" '
            /-----BEGIN CERTIFICATE-----/ {n++; file=sprintf("%s/cert-%02d.pem", out, n)}
            file != "" {print > file}
            /-----END CERTIFICATE-----/ {close(file); file=""}
          ' "$TLS_DIR/handshake.txt"

          LEAF="$TLS_DIR/certs/cert-01.pem"
          test -s "$LEAF"

          openssl x509 -in "$LEAF" -noout \
            -subject -issuer -serial -dates -fingerprint -sha256 \
            >"$TLS_DIR/leaf-summary.txt"
          openssl x509 -in "$LEAF" -noout -ext subjectAltName \
            >"$TLS_DIR/leaf-san.txt"
          openssl x509 -in "$LEAF" -noout -ext authorityInfoAccess \
            >"$TLS_DIR/leaf-aia.txt"
          openssl x509 -in "$LEAF" -noout -text >"$TLS_DIR/leaf-full.txt"

          grep -q 'DNS:massive-ftp.ucsd.edu' "$TLS_DIR/leaf-san.txt"

          AIA_URL="$(sed -n 's/^[[:space:]]*CA Issuers - URI://p' \
            "$TLS_DIR/leaf-aia.txt" | head -n 1)"
          test -n "$AIA_URL"
          printf '%s\n' "$AIA_URL" >"$TLS_DIR/issuer-aia-url.txt"

          # Prefer the HTTPS form of the CA endpoint. The certificate is accepted
          # only after its signature chain verifies against the system trust store.
          AIA_FETCH_URL="${AIA_URL/http:\/\//https://}"
          printf '%s\n' "$AIA_FETCH_URL" >"$TLS_DIR/issuer-fetch-url.txt"
          curl --fail --show-error --silent --location \
            --user-agent 'mzmine-open-offline-certificate-discovery/1' \
            --connect-timeout 20 --max-time 60 \
            --output "$TLS_DIR/issuer.download" "$AIA_FETCH_URL"

          if openssl x509 -in "$TLS_DIR/issuer.download" -noout >/dev/null 2>&1; then
            cp "$TLS_DIR/issuer.download" "$TLS_DIR/issuer.pem"
          else
            openssl x509 -inform DER -in "$TLS_DIR/issuer.download" \
              -out "$TLS_DIR/issuer.pem"
          fi

          openssl x509 -in "$TLS_DIR/issuer.pem" -noout \
            -subject -issuer -serial -dates -fingerprint -sha256 \
            >"$TLS_DIR/issuer-summary.txt"

          openssl verify \
            -CAfile /etc/ssl/certs/ca-certificates.crt \
            -untrusted "$TLS_DIR/issuer.pem" \
            "$LEAF" | tee "$TLS_DIR/verify-result.txt"
          grep -q ': OK$' "$TLS_DIR/verify-result.txt"

          cat /etc/ssl/certs/ca-certificates.crt "$TLS_DIR/issuer.pem" \
            >"$TLS_DIR/verified-ca-bundle.pem"

      - name: Download through verified explicit FTPS
        shell: bash
        run: |
          set -euo pipefail
          FILE_URL="$(python -c 'import json; print(json.load(open("build/public_fixture_discovery/fixture_resolution.json"))["resolved_file_url"])')"
          DEST_DIR="build/public_fixture_discovery/download"
          DEST="$DEST_DIR/Method1_Set277193_100_BOST-06537.mzML"
          mkdir -p "$DEST_DIR"
          curl \
            --fail \
            --show-error \
            --silent \
            --ssl-reqd \
            --ftp-ssl \
            --ftp-pasv \
            --cacert build/public_fixture_discovery/tls/verified-ca-bundle.pem \
            --user 'anonymous:mzmine-open-offline@example.invalid' \
            --connect-timeout 30 \
            --max-time 240 \
            --retry 2 \
            --retry-delay 2 \
            --output "$DEST.part" \
            "$FILE_URL"
          test "$(stat -c %s "$DEST.part")" -eq 16978328
          mv "$DEST.part" "$DEST"

      - name: Calculate SHA-256 and write frozen report
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          output = Path("build/public_fixture_discovery")
          source = output / "download" / "Method1_Set277193_100_BOST-06537.mzML"
          digest = hashlib.sha256(source.read_bytes()).hexdigest()
          report = json.loads((output / "fixture_resolution.json").read_text(encoding="utf-8"))
          fingerprint_line = next(
              line for line in (output / "tls" / "leaf-summary.txt").read_text().splitlines()
              if "Fingerprint=" in line
          )
          report.update({
              "size_bytes": source.stat().st_size,
              "sha256": digest,
              "transfer_transport": "explicit FTPS with AIA intermediate verified to system roots",
              "leaf_certificate_sha256": fingerprint_line.split("=", 1)[1]
                  .replace(":", "").strip().lower(),
              "local_file": str(source.resolve()),
          })
          (output / "fixture_report.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print(json.dumps(report, indent=2, sort_keys=True))
          PY

      - name: Remove downloaded dataset bytes and temporary certificates
        if: always()
        run: |
          rm -rf build/public_fixture_discovery/download
          rm -rf build/public_fixture_discovery/tls/certs
          rm -f build/public_fixture_discovery/tls/issuer.download
          rm -f build/public_fixture_discovery/tls/issuer.pem
          rm -f build/public_fixture_discovery/tls/verified-ca-bundle.pem
          rm -f build/public_fixture_discovery/tls/leaf-full.txt

      - name: Upload metadata and TLS diagnostics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MSV000101091-fixture-report
          path: |
            build/public_fixture_discovery/fixture_resolution.json
            build/public_fixture_discovery/fixture_report.json
            build/public_fixture_discovery/tls/handshake.txt
            build/public_fixture_discovery/tls/leaf-summary.txt
            build/public_fixture_discovery/tls/leaf-san.txt
            build/public_fixture_discovery/tls/leaf-aia.txt
            build/public_fixture_discovery/tls/issuer-aia-url.txt
            build/public_fixture_discovery/tls/issuer-fetch-url.txt
            build/public_fixture_discovery/tls/issuer-summary.txt
            build/public_fixture_discovery/tls/verify-result.txt
          if-no-files-found: warn
          retention-days: 14

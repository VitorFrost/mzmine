name: Discover Public LC-MS Fixture

on:
  push:
    branches:
      - agent/public-small-lcms-fixture
  pull_request:
    branches:
      - open-offline-main
    paths:
      - scripts/discover_zenodo_fixture.py
      - .github/workflows/discover_public_fixture.yml
      - datasets/public_validation_manifest.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover-real-lcms-fixture:
    name: Resolve and hash Zenodo LC-MS fixture
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve record metadata and file provenance
        run: >-
          python scripts/discover_zenodo_fixture.py
          --record 14001110
          --file Banane_30ngmL_001.mzML
          --required-license cc-by-4.0
          --output-directory build/public_fixture_discovery
          --timeout 90
          --resolve-only

      - name: Display resolved metadata
        run: cat build/public_fixture_discovery/fixture_resolution.json

      - name: Download through verified HTTPS and calculate SHA-256
        run: >-
          timeout 600s python scripts/discover_zenodo_fixture.py
          --record 14001110
          --file Banane_30ngmL_001.mzML
          --required-license cc-by-4.0
          --output-directory build/public_fixture_discovery
          --timeout 300

      - name: Display frozen metadata candidate
        run: cat build/public_fixture_discovery/fixture_report.json

      - name: Remove downloaded dataset bytes
        if: always()
        run: rm -rf build/public_fixture_discovery/download

      - name: Upload metadata report only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zenodo-14001110-Banane-30ngmL-001-report
          path: |
            build/public_fixture_discovery/fixture_resolution.json
            build/public_fixture_discovery/fixture_report.json
          if-no-files-found: warn
          retention-days: 14

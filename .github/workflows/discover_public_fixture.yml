name: Validate Public LC-MS Fixture

on:
  push:
    branches:
      - agent/public-small-lcms-fixture
  pull_request:
    branches:
      - open-offline-main
    paths:
      - scripts/fetch_public_test_data.py
      - scripts/discover_zenodo_fixture.py
      - .github/workflows/discover_public_fixture.yml
      - datasets/public_validation_manifest.json
      - src/test/java/io/github/mzmine/modules/io/import_rawdata_mzml/PublicRealMzMLImportTest.java
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-real-lcms-fixture:
    name: Import frozen Zenodo LC-MS fixture
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java 20
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "20"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Validate manifest and policy tests
        run: |
          python scripts/fetch_public_test_data.py --validate
          python -m unittest discover -s scripts/tests -p "test_*.py" -v

      - name: Download and verify approved fixture
        run: >-
          python scripts/fetch_public_test_data.py
          --dataset zenodo-14001110-banane-30ngml-001
          --output-dir build/public_validation_data
          --timeout 300
          --retries 3

      - name: Verify frozen fixture again before Java import
        run: >-
          python scripts/fetch_public_test_data.py
          --dataset zenodo-14001110-banane-30ngml-001
          --output-dir build/public_validation_data
          --verify-existing

      - name: Import and characterize real public mzML
        env:
          OPEN_OFFLINE_PUBLIC_MZML: ${{ github.workspace }}/build/public_validation_data/zenodo/14001110/Banane_30ngmL_001.mzML
        run: >-
          ./gradlew test
          --tests io.github.mzmine.modules.io.import_rawdata_mzml.PublicRealMzMLImportTest
          --no-daemon
          --stacktrace

      - name: Display import summary
        run: cat build/public_validation/zenodo_14001110_Banane_30ngmL_001_import_summary.json

      - name: Remove downloaded dataset bytes
        if: always()
        run: rm -rf build/public_validation_data

      - name: Upload public import report only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zenodo-14001110-Banane-30ngmL-001-import-report
          path: |
            build/public_validation/zenodo_14001110_Banane_30ngmL_001_import_summary.json
            build/reports/tests/test/
            build/test-results/test/
          if-no-files-found: warn
          retention-days: 14

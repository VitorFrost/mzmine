name: Open Offline CI

on:
  push:
    branches:
      - "open-offline-main"
      - "agent/**"
  pull_request:
    branches:
      - "open-offline-main"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: open-offline-ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  independence-audit:
    name: Verify independence and public-data policy
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Record tested source commit
        shell: bash
        run: |
          mkdir -p ci-artifacts
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "ref=${GITHUB_REF}"
            echo "head_ref=${GITHUB_HEAD_REF}"
            echo "sha=$(git rev-parse HEAD)"
            echo "runner_os=${RUNNER_OS}"
          } > ci-artifacts/independence-metadata.txt

      - name: Audit source, build files, and JARs
        run: python scripts/verify_open_offline.py

      - name: Validate public dataset manifest
        run: python scripts/fetch_public_test_data.py --validate

      - name: Validate frozen MZmine v4.0.8 parity inventory
        run: >-
          python scripts/validate_mzmine_4_parity_inventory.py
          --output ci-artifacts/mzmine-v408-parity-inventory.json

      - name: Test fail-closed dataset and parity policies
        run: python -m unittest discover -s scripts/tests -p "test_*.py" -v

      - name: Upload independence and parity metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independence-metadata-${{ github.run_id }}
          path: ci-artifacts/
          if-no-files-found: error
          retention-days: 14

  compile-and-test:
    name: Compile and test (${{ matrix.os }})
    needs: independence-audit
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check out untouched MZmine 3.9.0 baseline
        uses: actions/checkout@v4
        with:
          ref: 2ac3ce3b25190430f3ae0e02c28ddbb94bc248ed
          path: baseline-mzmine-3.9
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java 20
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "20"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Record tested source commit
        shell: bash
        run: |
          mkdir -p ci-artifacts
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "ref=${GITHUB_REF}"
            echo "head_ref=${GITHUB_HEAD_REF}"
            echo "sha=$(git rev-parse HEAD)"
            echo "baseline_sha=$(git -C baseline-mzmine-3.9 rev-parse HEAD)"
            echo "runner_os=${RUNNER_OS}"
            echo "java_home=${JAVA_HOME}"
          } > ci-artifacts/compile-metadata.txt

      - name: Show tool versions and baseline commit
        shell: bash
        run: |
          java -version
          ./gradlew --version
          git rev-parse HEAD
          git -C baseline-mzmine-3.9 rev-parse HEAD

      - name: Compile and test on Linux
        if: runner.os != 'Windows'
        run: ./gradlew clean test classes --no-daemon --stacktrace

      - name: Compile and test on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\gradlew.bat clean test classes --no-daemon --stacktrace

      - name: Run headless startup smoke test
        run: python scripts/smoke_test_headless.py

      - name: Run deterministic headless batch reference
        run: python scripts/test_headless_batch.py

      - name: Compare with untouched MZmine 3.9.0
        run: python scripts/compare_unmodified_39.py baseline-mzmine-3.9

      - name: Upload exact tested commit metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tested-commit-${{ matrix.os }}-${{ github.run_id }}
          path: ci-artifacts/compile-metadata.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports after failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}-${{ github.run_id }}
          path: |
            build/reports/tests/
            build/test-results/
            build/open_offline_headless/
            baseline-mzmine-3.9/build/reports/tests/
            baseline-mzmine-3.9/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

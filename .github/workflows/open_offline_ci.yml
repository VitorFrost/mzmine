name: Open Offline CI

on:
  push:
    branches:
      - "agent/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independence-audit:
    name: Verify independence and public-data policy
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit source, build files, and JARs
        run: python scripts/verify_open_offline.py

      - name: Validate public dataset manifest
        run: python scripts/fetch_public_test_data.py --validate

      - name: Test fail-closed dataset policy
        run: python -m unittest discover -s scripts/tests -p "test_*.py" -v

  compile-and-test:
    name: Compile and test (${{ matrix.os }})
    needs: independence-audit
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check out untouched MZmine 3.9.0 baseline
        uses: actions/checkout@v4
        with:
          ref: 2ac3ce3b25190430f3ae0e02c28ddbb94bc248ed
          path: baseline-mzmine-3.9
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java 20
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "20"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Show tool versions and baseline commit
        shell: bash
        run: |
          java -version
          ./gradlew --version
          git -C baseline-mzmine-3.9 rev-parse HEAD

      - name: Compile and test on Linux
        if: runner.os != 'Windows'
        run: ./gradlew clean test classes --no-daemon --stacktrace

      - name: Compile and test on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\gradlew.bat clean test classes --no-daemon --stacktrace

      - name: Run headless startup smoke test
        run: python scripts/smoke_test_headless.py

      - name: Run deterministic headless batch reference
        run: python scripts/test_headless_batch.py

      - name: Compare with untouched MZmine 3.9.0
        run: python scripts/compare_unmodified_39.py baseline-mzmine-3.9

      - name: Upload test reports after failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            build/reports/tests/
            build/test-results/
            build/open_offline_headless/
            baseline-mzmine-3.9/build/reports/tests/
            baseline-mzmine-3.9/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
